name: Update Smoking Zones Data

on:
  schedule:
    - cron: '0 2 * * 1'   # 每週一 02:00 UTC（台北時間週一 10:00）
  workflow_dispatch:        # 允許手動觸發

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch smoking zones from data.taipei
        run: |
          DATASET_ID="8b2fcdeb-d14b-46c4-92d8-66ad07b96a91"
          OUTPUT="docs/smoking-zones.json"
          TMPFILE=$(mktemp)

          echo "::group::Fetching page 1"
          HTTP_CODE=$(curl -sSL \
            -w "%{http_code}" \
            -o "$TMPFILE" \
            --retry 3 --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (compatible; GitHub-Actions)" \
            -H "Accept: application/json" \
            "https://data.taipei/api/v1/dataset/${DATASET_ID}?scope=resourceAquire&limit=1000&offset=0")
          echo "HTTP status: $HTTP_CODE"
          echo "Response size: $(wc -c < "$TMPFILE") bytes"
          echo "::endgroup::"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::data.taipei API returned HTTP $HTTP_CODE"
            cat "$TMPFILE"
            exit 1
          fi

          # 驗證是否為合法 JSON
          python3 -c "import json,sys; json.load(open('$TMPFILE'))" || {
            echo "::error::Response is not valid JSON:"
            head -c 500 "$TMPFILE"
            exit 1
          }

          # 印出欄位名稱供除錯
          python3 - "$TMPFILE" "$OUTPUT" << 'PYEOF'
          import json, sys, datetime

          src, dst = sys.argv[1], sys.argv[2]
          with open(src, encoding='utf-8') as f:
              body = json.load(f)

          result   = body.get('result', body)
          all_rows = result.get('results', result.get('data', []))
          total    = int(result.get('count', 0))
          print(f'Rows in page: {len(all_rows)}, total reported: {total}', flush=True)

          if all_rows:
              print(f'Fields: {list(all_rows[0].keys())}', flush=True)
              print(f'Sample: {json.dumps(all_rows[0], ensure_ascii=False)[:300]}', flush=True)

          def find_coords(row):
              lng = lat = None
              for k in ('經度','X座標','座標X','longitude','WGS84經度','座標-WGS84-X','lng','long'):
                  v = row.get(k)
                  if v not in (None, ''):
                      try: lng = float(v); break
                      except: pass
              for k in ('緯度','Y座標','座標Y','latitude','WGS84緯度','座標-WGS84-Y','lat'):
                  v = row.get(k)
                  if v not in (None, ''):
                      try: lat = float(v); break
                      except: pass
              # 掃描所有欄位以數值範圍判斷
              if lng is None or lat is None:
                  for v in row.values():
                      try:
                          f = float(v)
                          if 121.4 <= f <= 121.7: lng = f
                          elif 24.9  <= f <= 25.3:  lat = f
                      except: pass
              return lng, lat

          features = []
          skipped  = 0
          for row in all_rows:
              lng, lat = find_coords(row)
              if lng is None or lat is None:
                  skipped += 1
                  continue
              if not (24.9 <= lat <= 25.3 and 121.4 <= lng <= 121.7):
                  skipped += 1
                  continue
              features.append({
                  'type': 'Feature',
                  'geometry': {'type': 'Point', 'coordinates': [lng, lat]},
                  'properties': {
                      'name':    row.get('名稱', row.get('地點名稱', row.get('場所名稱', ''))),
                      'address': row.get('地址', row.get('住址', row.get('位置', ''))),
                      'type':    row.get('類型', row.get('場所類型', row.get('吸菸區類型', '')))
                  }
              })

          print(f'Valid features: {len(features)}, skipped: {skipped}', flush=True)

          if len(features) == 0 and len(all_rows) > 0:
              print('::error::All rows skipped — check field names above', flush=True)
              sys.exit(1)

          geojson = {
              'type': 'FeatureCollection',
              'generated': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'features': features
          }
          with open(dst, 'w', encoding='utf-8') as f:
              json.dump(geojson, f, ensure_ascii=False, separators=(',', ':'))
          print(f'Written to {dst}', flush=True)
          PYEOF

      - name: Verify output
        run: |
          python3 -c "
          import json
          with open('docs/smoking-zones.json') as f:
              d = json.load(f)
          n = len(d['features'])
          print(f'Features written: {n}')
          if n == 0:
              raise SystemExit('No features — something went wrong')
          "

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/smoking-zones.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update smoking-zones.json [skip ci]"
            git push
          fi
