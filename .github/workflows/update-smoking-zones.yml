name: Update Smoking Zones Data

on:
  schedule:
    - cron: '0 2 * * 1'   # 每週一 02:00 UTC（台北時間週一 10:00）
  workflow_dispatch:        # 允許手動觸發

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and convert smoking zones
        run: |
          python3 << 'PYEOF'
          import json, sys, urllib.request, datetime

          DATASET_ID = '8b2fcdeb-d14b-46c4-92d8-66ad07b96a91'
          OUTPUT     = 'docs/smoking-zones.json'
          HEADERS    = {
              'User-Agent': 'Mozilla/5.0 (compatible; GitHub-Actions)',
              'Accept':     'application/json',
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          # ── Step 1：取得 dataset metadata ──────────────────────
          print('=== Step 1: dataset metadata')
          meta_url = f'https://data.taipei/api/v1/dataset/{DATASET_ID}'
          meta = fetch(meta_url)
          print(json.dumps(meta, ensure_ascii=False)[:2000])

          result    = meta.get('result', meta) if isinstance(meta, dict) else {}
          resources = result.get('resources', []) if isinstance(result, dict) else []
          print(f'Resources found: {len(resources)}')

          # ── Step 2：對每個 resource 嘗試抓資料 ─────────────────
          all_rows = []
          for r in resources:
              rid  = r.get('id') or r.get('rid', '')
              fmt  = r.get('format', r.get('name', '?'))
              print(f'  Trying resource id={rid} format={fmt}')
              if not rid:
                  continue
              url = f'https://data.taipei/api/v1/dataset/{rid}?scope=resourceAquire&limit=1000&offset=0'
              try:
                  body = fetch(url)
              except Exception as e:
                  print(f'    ERROR: {e}'); continue

              if isinstance(body, list):
                  rows = body
              elif isinstance(body, dict):
                  res  = body.get('result', body)
                  rows = res.get('results', res.get('data', [])) if isinstance(res, dict) else (res if isinstance(res, list) else [])
              else:
                  rows = []

              print(f'    rows: {len(rows)}')
              if rows:
                  print(f'    fields: {list(rows[0].keys())}')
                  print(f'    sample: {json.dumps(rows[0], ensure_ascii=False)[:400]}')
                  all_rows.extend(rows)

          print(f'Total rows: {len(all_rows)}')
          if not all_rows:
              print('::error::No rows from any resource — check metadata above')
              sys.exit(1)

          # ── Step 3：解析座標 ────────────────────────────────────
          def find_coords(row):
              lng = lat = None
              for k in ('經度','X座標','座標X','longitude','WGS84經度','座標-WGS84-X','lng'):
                  v = row.get(k)
                  if v not in (None, ''):
                      try: lng = float(v); break
                      except: pass
              for k in ('緯度','Y座標','座標Y','latitude','WGS84緯度','座標-WGS84-Y','lat'):
                  v = row.get(k)
                  if v not in (None, ''):
                      try: lat = float(v); break
                      except: pass
              # 若仍找不到，掃描所有欄位以數值範圍判斷
              if lng is None or lat is None:
                  for v in row.values():
                      try:
                          f = float(v)
                          if lng is None and 121.4 <= f <= 121.7: lng = f
                          if lat is None and 24.9  <= f <= 25.3:  lat = f
                      except: pass
              return lng, lat

          features = []
          skipped  = 0
          for row in all_rows:
              lng, lat = find_coords(row)
              if lng is None or lat is None:
                  skipped += 1; continue
              if not (24.9 <= lat <= 25.3 and 121.4 <= lng <= 121.7):
                  skipped += 1; continue
              features.append({
                  'type': 'Feature',
                  'geometry': {'type': 'Point', 'coordinates': [lng, lat]},
                  'properties': {
                      'name':    row.get('名稱', row.get('地點名稱', row.get('場所名稱', ''))),
                      'address': row.get('地址', row.get('住址', row.get('位置', ''))),
                      'type':    row.get('類型', row.get('場所類型', row.get('吸菸區類型', '')))
                  }
              })

          print(f'Valid features: {len(features)}, skipped: {skipped}')
          if not features:
              print('=== Numeric fields in first row:')
              for k, v in all_rows[0].items():
                  try: print(f'  {k!r}: {float(v)}')
                  except: pass
              print('::error::No valid coordinates — check field names above')
              sys.exit(1)

          geojson = {
              'type': 'FeatureCollection',
              'generated': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'features': features
          }
          with open(OUTPUT, 'w', encoding='utf-8') as f:
              json.dump(geojson, f, ensure_ascii=False, separators=(',', ':'))
          print(f'Written {len(features)} features to {OUTPUT}')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/smoking-zones.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update smoking-zones.json [skip ci]"
            git push
          fi
