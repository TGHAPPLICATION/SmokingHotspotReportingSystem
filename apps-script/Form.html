<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>環保局菸蒂稽查回報</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,.12);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }

  .card-header {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: #fff;
    padding: 24px 20px 20px;
  }
  .card-header h1 { font-size: 1.3rem; font-weight: 700; }
  .card-header p  { font-size: .85rem; opacity: .85; margin-top: 4px; }

  .card-body { padding: 20px; }

  .section-title {
    font-size: .8rem;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }
  .mb-16 { margin-bottom: 16px; }

  /* 一般輸入欄位共用樣式 */
  .text-input, .select-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 12px;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
    background: #fff;
  }
  .text-input:focus, .select-input:focus { border-color: #e74c3c; }

  .field-row { display: flex; gap: 8px; }
  .field-row > * { flex: 1; min-width: 0; }

  /* 位置區塊 */
  .location-block { margin-bottom: 20px; }
  .location-block label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .gps-btn {
    width: 100%;
    padding: 14px;
    border: 2px dashed #e74c3c;
    border-radius: 12px;
    background: #fff5f5;
    color: #e74c3c;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .gps-btn:hover { background: #ffe0e0; }
  .gps-btn.success { border-color: #27ae60; color: #27ae60; background: #f0fff4; }
  .gps-btn.loading { opacity: .7; cursor: not-allowed; }

  .divider {
    text-align: center;
    color: #aaa;
    font-size: .8rem;
    margin: 12px 0;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 42%;
    height: 1px;
    background: #e0e0e0;
  }
  .divider::before { left: 0; }
  .divider::after  { right: 0; }

  .geocode-btn {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: .9rem;
    cursor: pointer;
    transition: background .2s;
  }
  .geocode-btn:hover { background: #c0392b; }
  .geocode-btn:disabled { background: #ccc; cursor: not-allowed; }

  #map-preview {
    width: 100%;
    height: 180px;
    border-radius: 12px;
    margin-top: 12px;
    display: none;
    border: 1.5px solid #e0e0e0;
  }

  /* 照片上傳 */
  .photo-btn {
    width: 100%;
    padding: 12px;
    border: 1.5px dashed #999;
    border-radius: 12px;
    background: #fafafa;
    color: #555;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .photo-btn:hover { background: #f0f0f0; }
  .photo-preview-wrap { margin-top: 10px; position: relative; display: none; }
  .photo-preview {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    border: 1.5px solid #e0e0e0;
    display: block;
  }
  .photo-remove-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,.6);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 28px; height: 28px;
    font-size: .9rem;
    cursor: pointer;
  }

  /* 補充說明 */
  .desc-area {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 12px;
    font-size: .95rem;
    resize: vertical;
    min-height: 80px;
    outline: none;
    font-family: inherit;
    transition: border-color .2s;
  }
  .desc-area:focus { border-color: #e74c3c; }

  .char-count { text-align: right; font-size: .75rem; color: #aaa; margin-top: 4px; }

  /* 時段顯示 */
  .timeslot-badge {
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .85rem;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    transition: background .3s, color .3s, border-color .3s;
  }
  .timeslot-badge.band-0 { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; }
  .timeslot-badge.band-1 { background: #f0fdf4; border: 1px solid #6ee7b7; color: #065f46; }
  .timeslot-badge.band-2 { background: #fefce8; border: 1px solid #fde047; color: #854d0e; }
  .timeslot-badge.band-3 { background: #fff1f2; border: 1px solid #fca5a5; color: #991b1b; }

  /* 送出按鈕 */
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    box-shadow: 0 4px 12px rgba(231,76,60,.35);
  }
  .submit-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
  .submit-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

  /* 狀態訊息 */
  .status-msg {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: .9rem;
    display: none;
  }
  .status-msg.success { background: #d4edda; color: #155724; }
  .status-msg.error   { background: #f8d7da; color: #721c24; }

  /* 分頁切換 */
  .tab-bar {
    display: flex;
    background: #f0f4f8;
    padding: 6px;
    gap: 6px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #777;
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
  }
  .tab-btn.active { background: #fff; color: #e74c3c; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>🚭 環保局菸蒂稽查回報</h1>
    <p>稽查人員現場勸導 / 蒐證登錄</p>
  </div>

  <div class="tab-bar">
    <button class="tab-btn" id="tab-btn-butts" onclick="switchTab('butts')">🚬 菸蒂通報</button>
    <button class="tab-btn" id="tab-btn-patrol" onclick="switchTab('patrol')">🔍 吸菸區巡查</button>
  </div>

  <div class="card-body" id="tab-content-patrol" style="display:none;">

    <!-- 巡檢日期時間 -->
    <div class="timeslot-badge band-1" id="patrol-time-badge">
      🕐 巡檢時間：<strong id="patrol-time-label">計算中…</strong>
    </div>

    <!-- 指定吸菸區 -->
    <div class="mb-16">
      <div class="section-title">指定吸菸區 *</div>
      <select class="select-input mb-16" id="zone-district-select" onchange="onZoneDistrictChange()">
        <option value="">請選擇行政區</option>
      </select>
      <select class="select-input" id="zone-location-select" onchange="onZoneLocationChange()" disabled>
        <option value="">請先選擇行政區</option>
      </select>
    </div>

    <!-- 管理單位（自動帶入，唯讀）-->
    <div class="mb-16">
      <div class="section-title">管理單位</div>
      <input class="text-input" id="zone-managing-unit" type="text" readonly placeholder="選擇地點後自動帶入">
    </div>

    <!-- 填報人姓名 -->
    <div class="mb-16">
      <div class="section-title">填報人姓名 *</div>
      <input class="text-input" id="patrol-reporter-name" type="text"
        placeholder="姓名" oninput="validatePatrolFormReady()">
    </div>

    <!-- 照片上傳 -->
    <div class="mb-16">
      <div class="section-title">現場照片（選填）</div>
      <button type="button" class="photo-btn" id="patrol-photo-btn" onclick="document.getElementById('patrol-photo-input').click()">
        📷 <span id="patrol-photo-btn-text">拍照 / 選擇照片</span>
      </button>
      <input type="file" id="patrol-photo-input" accept="image/*" capture="environment"
        style="display:none" onchange="onPatrolPhotoSelected(event)">
      <div class="photo-preview-wrap" id="patrol-photo-preview-wrap">
        <img class="photo-preview" id="patrol-photo-preview">
        <button type="button" class="photo-remove-btn" onclick="removePatrolPhoto()">✕</button>
      </div>
    </div>

    <!-- 送出 -->
    <button class="submit-btn" id="patrol-submit-btn" onclick="submitZonePatrol()" disabled>
      送出巡查紀錄
    </button>

    <div class="status-msg" id="patrol-status-msg"></div>
  </div>

  <div class="card-body" id="tab-content-butts">

    <!-- 目前時段 -->
    <div class="timeslot-badge band-1" id="timeslot-badge">
      🕐 通報時段：<strong id="slot-label">計算中…</strong>
    </div>

    <!-- 稽查人員資訊 -->
    <div class="mb-16">
      <div class="section-title">稽查人員資訊 *</div>
      <div class="field-row mb-16">
        <input class="text-input" id="inspector-unit" type="text"
          placeholder="稽查單位" oninput="validateFormReady()">
        <input class="text-input" id="inspector-name" type="text"
          placeholder="姓名" oninput="validateFormReady()">
      </div>
      <select class="select-input" id="district-select" onchange="validateFormReady()">
        <option value="">請選擇行政區</option>
        <option value="中正區">中正區</option>
        <option value="大同區">大同區</option>
        <option value="中山區">中山區</option>
        <option value="松山區">松山區</option>
        <option value="大安區">大安區</option>
        <option value="萬華區">萬華區</option>
        <option value="信義區">信義區</option>
        <option value="士林區">士林區</option>
        <option value="北投區">北投區</option>
        <option value="內湖區">內湖區</option>
        <option value="南港區">南港區</option>
        <option value="文山區">文山區</option>
      </select>
    </div>

    <!-- 位置 -->
    <div class="location-block">
      <div class="section-title">通報位置 *</div>

      <button class="gps-btn" id="gps-btn" onclick="getGPS()">
        <span id="gps-icon">📍</span>
        <span id="gps-text">取得 GPS 定位</span>
      </button>

      <div class="divider">或手動輸入地址</div>

      <input class="text-input" id="address-input"
        type="text" placeholder="例：台北市信義區市府路45號"
        oninput="onAddressInput()">
      <button class="geocode-btn" id="geocode-btn" onclick="geocodeAddress()" disabled>
        查詢地址座標
      </button>
    </div>

    <div id="map-preview"></div>

    <!-- 照片上傳 -->
    <div class="mb-16" style="margin-top: 16px;">
      <div class="section-title">現場照片（選填）</div>
      <button type="button" class="photo-btn" id="photo-btn" onclick="document.getElementById('photo-input').click()">
        📷 <span id="photo-btn-text">拍照 / 選擇照片</span>
      </button>
      <input type="file" id="photo-input" accept="image/*" capture="environment"
        style="display:none" onchange="onPhotoSelected(event)">
      <div class="photo-preview-wrap" id="photo-preview-wrap">
        <img class="photo-preview" id="photo-preview">
        <button type="button" class="photo-remove-btn" onclick="removePhoto()">✕</button>
      </div>
    </div>

    <!-- 菸蒂數量 -->
    <div class="mb-16">
      <div class="section-title">菸蒂數量（選填）</div>
      <input class="text-input" id="butt-count" type="number" min="1" step="1"
        inputmode="numeric" placeholder="請輸入正整數" oninput="onButtCountInput()">
    </div>

    <!-- 補充說明 -->
    <div class="mb-16">
      <div class="section-title">補充說明（選填）</div>
      <textarea class="desc-area" id="description" maxlength="100"
        placeholder="例：騎樓下、公園入口附近…"
        oninput="updateCharCount()"></textarea>
      <div class="char-count"><span id="char-count">0</span> / 100</div>
    </div>

    <!-- 送出 -->
    <button class="submit-btn" id="submit-btn" onclick="submitReport()" disabled>
      送出通報
    </button>

    <div class="status-msg" id="status-msg"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── 狀態 ─────────────────────────────────────────────────────
var state = {
  lat: null,
  lng: null,
  locationSource: null,
  timeSlot: null,
  map: null,
  marker: null,
  photoBase64: null,   // 不含 data URL 前綴
  photoMimeType: null
};

var PROFILE_KEY = 'smoking_inspector_profile';
var PATROL_PROFILE_KEY = 'smoking_zone_patrol_profile';
var TAB_STORAGE_KEY = 'smoking_form_active_tab';
var MAX_PHOTO_DIMENSION = 1600;
var PHOTO_JPEG_QUALITY = 0.75;

// 吸菸區巡查分頁專用狀態（跟「菸蒂通報」分頁的 state 分開，避免互相干擾）
var patrolState = {
  photoBase64: null,
  photoMimeType: null
};
var zoneData = [];       // {district, location, unit}[]，從「指定吸菸區設定」載入
var zoneDataLoaded = false;

// ── 初始化 ────────────────────────────────────────────────────
(function init() {
  updateSlotLabel();
  setInterval(updateSlotLabel, 60000);
  loadProfileFromStorage();
  updatePatrolTimeLabel();
  setInterval(updatePatrolTimeLabel, 30000);
  loadPatrolProfileFromStorage();
  switchTab(localStorage.getItem(TAB_STORAGE_KEY) || 'butts');
})();

// ── 分頁切換（菸蒂通報 / 吸菸區巡查）──────────────────────────
function switchTab(tab) {
  document.getElementById('tab-content-butts').style.display  = tab === 'butts'  ? 'block' : 'none';
  document.getElementById('tab-content-patrol').style.display = tab === 'patrol' ? 'block' : 'none';
  document.getElementById('tab-btn-butts').classList.toggle('active', tab === 'butts');
  document.getElementById('tab-btn-patrol').classList.toggle('active', tab === 'patrol');
  localStorage.setItem(TAB_STORAGE_KEY, tab);
  if (tab === 'patrol') loadDesignatedZones();
}

function updatePatrolTimeLabel() {
  var now = new Date();
  var pad2 = function(n) { return (n < 10 ? '0' : '') + n; };
  document.getElementById('patrol-time-label').textContent =
    now.getFullYear() + '/' + pad2(now.getMonth() + 1) + '/' + pad2(now.getDate()) +
    ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
}

function updateSlotLabel() {
  var bands = [
    { label: '00–04 時', cls: 'band-0', max: 4  },
    { label: '04–10 時', cls: 'band-1', max: 10 },
    { label: '10–16 時', cls: 'band-2', max: 16 },
    { label: '16–24 時', cls: 'band-3', max: 24 }
  ];
  var h = new Date().getHours();
  state.timeSlot = Math.floor(h / 2);
  var band = bands[3];
  for (var i = 0; i < bands.length; i++) {
    if (h < bands[i].max) { band = bands[i]; break; }
  }
  document.getElementById('slot-label').textContent = band.label;
  document.getElementById('timeslot-badge').className = 'timeslot-badge ' + band.cls;
}

// ── 稽查人員預設值（LocalStorage）────────────────────────────
function loadProfileFromStorage() {
  var raw = localStorage.getItem(PROFILE_KEY);
  if (!raw) return;
  try {
    var profile = JSON.parse(raw);
    if (profile.unit) document.getElementById('inspector-unit').value = profile.unit;
    if (profile.name) document.getElementById('inspector-name').value = profile.name;
    if (profile.district) document.getElementById('district-select').value = profile.district;
  } catch (e) { /* 忽略壞掉的舊資料 */ }
}

function saveProfileToStorage() {
  var profile = {
    unit: document.getElementById('inspector-unit').value.trim(),
    name: document.getElementById('inspector-name').value.trim(),
    district: document.getElementById('district-select').value
  };
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
}

// ── 表單是否可送出 ────────────────────────────────────────────
function validateFormReady() {
  var hasLocation = state.lat !== null && state.lng !== null;
  var hasUnit = document.getElementById('inspector-unit').value.trim().length > 0;
  var hasName = document.getElementById('inspector-name').value.trim().length > 0;
  var hasDistrict = document.getElementById('district-select').value.length > 0;
  document.getElementById('submit-btn').disabled = !(hasLocation && hasUnit && hasName && hasDistrict);
}

// ── GPS 定位 ──────────────────────────────────────────────────
function getGPS() {
  if (!navigator.geolocation) {
    showMsg('您的瀏覽器不支援 GPS 定位，請手動輸入地址。', 'error');
    return;
  }
  setGPSBtnState('loading', '定位中…');
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      setLocation(pos.coords.latitude, pos.coords.longitude, 'gps');
      setGPSBtnState('success', '✓ 已取得 GPS 定位');
    },
    function(err) {
      setGPSBtnState('', '重新取得 GPS 定位');
      var msgs = {
        1: 'GPS 授權被拒絕，請在瀏覽器設定中允許定位，或手動輸入地址。',
        2: '無法取得 GPS 訊號，請手動輸入地址。',
        3: 'GPS 定位逾時，請手動輸入地址。'
      };
      showMsg(msgs[err.code] || 'GPS 定位失敗，請手動輸入地址。', 'error');
    },
    { timeout: 10000, maximumAge: 0, enableHighAccuracy: true }
  );
}

function setGPSBtnState(cls, text) {
  var btn = document.getElementById('gps-btn');
  btn.className = 'gps-btn' + (cls ? ' ' + cls : '');
  btn.disabled = cls === 'loading';
  document.getElementById('gps-text').textContent = text;
}

// ── 地址地理編碼 ──────────────────────────────────────────────
function onAddressInput() {
  var val = document.getElementById('address-input').value.trim();
  document.getElementById('geocode-btn').disabled = val.length < 3;
}

function geocodeAddress() {
  var addr = document.getElementById('address-input').value.trim();
  if (!addr) return;

  var btn = document.getElementById('geocode-btn');
  btn.disabled = true;
  btn.textContent = '查詢中…';

  // 透過 Apps Script 後端呼叫 Google Maps Geocoding（不需 API Key）
  google.script.run
    .withSuccessHandler(function(result) {
      btn.textContent = '查詢地址座標';
      btn.disabled = false;
      if (!result || !result.success) {
        showMsg('找不到此地址，請嘗試更詳細的地址。', 'error');
        return;
      }
      setLocation(result.lat, result.lng, 'manual');
    })
    .withFailureHandler(function() {
      btn.textContent = '查詢地址座標';
      btn.disabled = false;
      showMsg('地址查詢失敗，請稍後再試。', 'error');
    })
    .geocodeAddressServer(addr);
}

// ── 設定位置 & 地圖預覽 ───────────────────────────────────────
function setLocation(lat, lng, source) {
  state.lat = lat;
  state.lng = lng;
  state.locationSource = source;

  validateFormReady();
  document.getElementById('map-preview').style.display = 'block';

  if (!state.map) {
    state.map = L.map('map-preview', { zoomControl: true, attributionControl: false })
      .setView([lat, lng], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(state.map);
    state.marker = L.marker([lat, lng]).addTo(state.map);
  } else {
    state.map.setView([lat, lng], 16);
    state.marker.setLatLng([lat, lng]);
  }

  // 觸發 Leaflet resize（在隱藏元素變可見後）
  setTimeout(function() { state.map.invalidateSize(); }, 100);
}

// ── 照片選取 & 用戶端壓縮（菸蒂通報／吸菸區巡查共用同一套壓縮邏輯）──
// callback(dataUrl)：dataUrl 為完整的 data:image/jpeg;base64,... 字串
function compressImageFile(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var scale = Math.min(1, MAX_PHOTO_DIMENSION / Math.max(img.width, img.height));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function onPhotoSelected(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  document.getElementById('photo-btn-text').textContent = '處理照片中…';
  compressImageFile(file, function(dataUrl) {
    state.photoBase64 = dataUrl.split(',')[1];
    state.photoMimeType = 'image/jpeg';
    document.getElementById('photo-preview').src = dataUrl;
    document.getElementById('photo-preview-wrap').style.display = 'block';
    document.getElementById('photo-btn-text').textContent = '重新選擇照片';
  });
}

function removePhoto() {
  state.photoBase64 = null;
  state.photoMimeType = null;
  document.getElementById('photo-input').value = '';
  document.getElementById('photo-preview-wrap').style.display = 'none';
  document.getElementById('photo-btn-text').textContent = '拍照 / 選擇照片';
}

// ── 吸菸區巡查：指定吸菸區下拉選單（行政區 → 地點 → 自動帶入管理單位）──
function loadDesignatedZones() {
  if (zoneDataLoaded) return;
  var districtSelect = document.getElementById('zone-district-select');
  districtSelect.disabled = true;
  google.script.run
    .withSuccessHandler(function(result) {
      districtSelect.disabled = false;
      if (!result || !result.success) {
        showPatrolMsg('無法載入指定吸菸區清單，請稍後再試。', 'error');
        return;
      }
      zoneData = result.zones || [];
      zoneDataLoaded = true;
      var districts = [];
      zoneData.forEach(function(z) {
        if (districts.indexOf(z.district) === -1) districts.push(z.district);
      });
      districts.forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });
    })
    .withFailureHandler(function() {
      districtSelect.disabled = false;
      showPatrolMsg('網路錯誤，無法載入指定吸菸區清單。', 'error');
    })
    .getDesignatedSmokingZones();
}

function onZoneDistrictChange() {
  var district = document.getElementById('zone-district-select').value;
  var locationSelect = document.getElementById('zone-location-select');
  locationSelect.innerHTML = '<option value="">請選擇地點</option>';
  document.getElementById('zone-managing-unit').value = '';
  locationSelect.disabled = !district;
  if (district) {
    zoneData.filter(function(z) { return z.district === district; }).forEach(function(z) {
      var opt = document.createElement('option');
      opt.value = z.location;
      opt.textContent = z.location;
      locationSelect.appendChild(opt);
    });
  }
  validatePatrolFormReady();
}

function onZoneLocationChange() {
  var district = document.getElementById('zone-district-select').value;
  var location = document.getElementById('zone-location-select').value;
  var match = zoneData.filter(function(z) { return z.district === district && z.location === location; })[0];
  document.getElementById('zone-managing-unit').value = match ? match.unit : '';
  validatePatrolFormReady();
}

function validatePatrolFormReady() {
  var hasDistrict = document.getElementById('zone-district-select').value.length > 0;
  var hasLocation = document.getElementById('zone-location-select').value.length > 0;
  var hasUnit = document.getElementById('zone-managing-unit').value.length > 0;
  var hasName = document.getElementById('patrol-reporter-name').value.trim().length > 0;
  document.getElementById('patrol-submit-btn').disabled = !(hasDistrict && hasLocation && hasUnit && hasName);
}

// ── 吸菸區巡查：填報人姓名預設值（LocalStorage）────────────────
function loadPatrolProfileFromStorage() {
  var raw = localStorage.getItem(PATROL_PROFILE_KEY);
  if (!raw) return;
  try {
    var profile = JSON.parse(raw);
    if (profile.reporterName) document.getElementById('patrol-reporter-name').value = profile.reporterName;
  } catch (e) { /* 忽略壞掉的舊資料 */ }
}

function savePatrolProfileToStorage() {
  localStorage.setItem(PATROL_PROFILE_KEY, JSON.stringify({
    reporterName: document.getElementById('patrol-reporter-name').value.trim()
  }));
}

// ── 吸菸區巡查：照片選取（與菸蒂通報共用 compressImageFile）─────
function onPatrolPhotoSelected(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  document.getElementById('patrol-photo-btn-text').textContent = '處理照片中…';
  compressImageFile(file, function(dataUrl) {
    patrolState.photoBase64 = dataUrl.split(',')[1];
    patrolState.photoMimeType = 'image/jpeg';
    document.getElementById('patrol-photo-preview').src = dataUrl;
    document.getElementById('patrol-photo-preview-wrap').style.display = 'block';
    document.getElementById('patrol-photo-btn-text').textContent = '重新選擇照片';
  });
}

function removePatrolPhoto() {
  patrolState.photoBase64 = null;
  patrolState.photoMimeType = null;
  document.getElementById('patrol-photo-input').value = '';
  document.getElementById('patrol-photo-preview-wrap').style.display = 'none';
  document.getElementById('patrol-photo-btn-text').textContent = '拍照 / 選擇照片';
}

// ── 吸菸區巡查：送出表單 ──────────────────────────────────────
function submitZonePatrol() {
  var btn = document.getElementById('patrol-submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';
  hidePatrolMsg();

  if (patrolState.photoBase64) {
    btn.textContent = '上傳照片中…';
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          finishZonePatrolSubmit(result.url);
        } else {
          btn.disabled = false;
          btn.textContent = '送出巡查紀錄';
          if (confirm('照片上傳失敗（' + (result && result.error) + '），是否要不含照片直接送出？')) {
            finishZonePatrolSubmit('');
          }
        }
      })
      .withFailureHandler(function() {
        btn.disabled = false;
        btn.textContent = '送出巡查紀錄';
        if (confirm('照片上傳失敗，是否要不含照片直接送出？')) {
          finishZonePatrolSubmit('');
        }
      })
      .uploadInspectionPhoto(patrolState.photoBase64, patrolState.photoMimeType, 'patrol_' + Date.now() + '.jpg');
  } else {
    finishZonePatrolSubmit('');
  }
}

function finishZonePatrolSubmit(photoUrl) {
  var btn = document.getElementById('patrol-submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';

  var payload = {
    district: document.getElementById('zone-district-select').value,
    location: document.getElementById('zone-location-select').value,
    managingUnit: document.getElementById('zone-managing-unit').value,
    reporterName: document.getElementById('patrol-reporter-name').value.trim(),
    photoUrl: photoUrl || ''
  };

  google.script.run
    .withSuccessHandler(function(result) {
      btn.textContent = '送出巡查紀錄';
      if (result && result.success) {
        savePatrolProfileToStorage();
        showPatrolMsg('✅ 巡查紀錄已送出！', 'success');
        resetPatrolForm();
      } else {
        var errMsgs = {
          MISSING_DISTRICT: '請選擇行政區。',
          MISSING_LOCATION: '請選擇地點。',
          MISSING_MANAGING_UNIT: '管理單位資料異常，請重新選擇地點。',
          MISSING_REPORTER_NAME: '請填寫填報人姓名。'
        };
        showPatrolMsg(errMsgs[result && result.error] || '送出失敗，請稍後再試。', 'error');
        btn.disabled = false;
      }
    })
    .withFailureHandler(function() {
      btn.textContent = '送出巡查紀錄';
      btn.disabled = false;
      showPatrolMsg('網路錯誤，請稍後再試。', 'error');
    })
    .processZonePatrolData(payload);
}

function showPatrolMsg(text, type) {
  var el = document.getElementById('patrol-status-msg');
  el.textContent = text;
  el.className = 'status-msg ' + type;
  el.style.display = 'block';
}
function hidePatrolMsg() {
  document.getElementById('patrol-status-msg').style.display = 'none';
}

function resetPatrolForm() {
  document.getElementById('zone-district-select').value = '';
  document.getElementById('zone-location-select').innerHTML = '<option value="">請先選擇行政區</option>';
  document.getElementById('zone-location-select').disabled = true;
  document.getElementById('zone-managing-unit').value = '';
  removePatrolPhoto();
  validatePatrolFormReady();
}

// ── 菸蒂數量：僅允許正整數 ────────────────────────────────────
function onButtCountInput() {
  var el = document.getElementById('butt-count');
  var digitsOnly = el.value.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
  if (digitsOnly !== el.value) el.value = digitsOnly;
}

// ── 字數計算 ──────────────────────────────────────────────────
function updateCharCount() {
  var len = document.getElementById('description').value.length;
  document.getElementById('char-count').textContent = len;
}

// ── 送出表單 ──────────────────────────────────────────────────
function submitReport() {
  if (!state.lat || !state.lng) {
    showMsg('請先取得 GPS 定位或輸入地址。', 'error');
    return;
  }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';
  hideMsg();

  if (state.photoBase64) {
    btn.textContent = '上傳照片中…';
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          finishSubmit(result.url);
        } else {
          btn.disabled = false;
          btn.textContent = '送出通報';
          if (confirm('照片上傳失敗（' + (result && result.error) + '），是否要不含照片直接送出？')) {
            finishSubmit('');
          }
        }
      })
      .withFailureHandler(function() {
        btn.disabled = false;
        btn.textContent = '送出通報';
        if (confirm('照片上傳失敗，是否要不含照片直接送出？')) {
          finishSubmit('');
        }
      })
      .uploadInspectionPhoto(state.photoBase64, state.photoMimeType, 'report_' + Date.now() + '.jpg');
  } else {
    finishSubmit('');
  }
}

function finishSubmit(photoUrl) {
  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';

  var payload = {
    lat: state.lat,
    lng: state.lng,
    locationSource: state.locationSource,
    addressInput: document.getElementById('address-input').value.trim(),
    description: document.getElementById('description').value.trim(),
    buttCount: document.getElementById('butt-count').value.trim(),
    district: document.getElementById('district-select').value,
    inspectorUnit: document.getElementById('inspector-unit').value.trim(),
    inspectorName: document.getElementById('inspector-name').value.trim(),
    photoUrl: photoUrl || '',
    reporterToken: getReporterToken()
  };

  google.script.run
    .withSuccessHandler(function(result) {
      btn.textContent = '送出通報';
      if (result && result.success) {
        saveProfileToStorage();
        showMsg('✅ 通報成功！已記錄至環保局菸蒂回報。', 'success');
        resetForm();
      } else {
        var errMsgs = {
          DUPLICATE_REPORT: '您已在此時段回報過相同地點。',
          OUT_OF_TAIPEI_BOUNDS: '此位置不在台北市範圍內，請確認位置是否正確。',
          INVALID_COORDINATES: '位置資料有誤，請重新定位。',
          MISSING_DISTRICT: '請選擇行政區。',
          MISSING_INSPECTOR_UNIT: '請填寫稽查單位。',
          MISSING_INSPECTOR_NAME: '請填寫稽查人員姓名。',
          INVALID_BUTT_COUNT: '菸蒂數量須為正整數。'
        };
        showMsg(errMsgs[result && result.error] || '送出失敗，請稍後再試。', 'error');
        btn.disabled = false;
      }
    })
    .withFailureHandler(function(err) {
      btn.textContent = '送出通報';
      btn.disabled = false;
      showMsg('網路錯誤，請稍後再試。', 'error');
    })
    .processFormData(payload);
}

// Apps Script 伺服器端呼叫橋接
// （Apps Script HTML Service 使用 google.script.run，
//  對應 Code.gs / Inspection.gs 中的 processFormData / uploadInspectionPhoto）
</script>

<script>
// ── 工具函式 ──────────────────────────────────────────────────
function getReporterToken() {
  var key = 'smoking_reporter_token';
  var token = localStorage.getItem(key);
  if (!token) {
    token = Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem(key, token);
  }
  return token;
}

function showMsg(text, type) {
  var el = document.getElementById('status-msg');
  el.textContent = text;
  el.className = 'status-msg ' + type;
  el.style.display = 'block';
}
function hideMsg() {
  document.getElementById('status-msg').style.display = 'none';
}

function resetForm() {
  state.lat = null;
  state.lng = null;
  state.locationSource = null;
  document.getElementById('address-input').value = '';
  document.getElementById('description').value = '';
  document.getElementById('butt-count').value = '';
  document.getElementById('char-count').textContent = '0';
  document.getElementById('map-preview').style.display = 'none';
  setGPSBtnState('', '取得 GPS 定位');
  document.getElementById('geocode-btn').disabled = true;
  removePhoto();
  validateFormReady();
}
</script>
