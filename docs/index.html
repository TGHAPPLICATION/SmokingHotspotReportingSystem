<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台北市吸菸熱點地圖</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── 頂部 Header ── */
  .header {
    background: rgba(13,17,23,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #30363d;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }
  .header h1 { font-size: 1rem; font-weight: 700; }
  .header p  { font-size: .72rem; color: #8b949e; margin-top: 1px; }

  .report-btn {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity .2s;
    white-space: nowrap;
  }
  .report-btn:hover { opacity: .85; }

  /* ── 地圖容器 ── */
  #map { flex: 1; position: relative; }

  /* ── 統計浮框 ── */
  .stats-overlay {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(13,17,23,.88);
    backdrop-filter: blur(10px);
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 12px 16px;
    min-width: 160px;
    z-index: 5;
  }
  .stats-overlay .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: .8rem;
    color: #8b949e;
    margin-bottom: 4px;
  }
  .stats-overlay .stat-row:last-child { margin-bottom: 0; }
  .stats-overlay .stat-num {
    font-size: 1.1rem;
    font-weight: 700;
    color: #f47174;
  }

  /* ── 定位按鈕 ── */
  .locate-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 40px; height: 40px;
    background: rgba(13,17,23,.88);
    backdrop-filter: blur(10px);
    border: 1px solid #30363d;
    border-radius: 10px;
    color: #e6edf3;
    font-size: 1.1rem;
    cursor: pointer;
    z-index: 5;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .locate-btn:hover { background: rgba(231,76,60,.3); }

  /* ── 時段選擇器（底部浮動）── */
  .slot-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 0 12px 12px;
  }

  .slot-panel-inner {
    background: rgba(13,17,23,.92);
    backdrop-filter: blur(16px);
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 12px 10px 10px;
  }

  .slot-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .slot-header-title {
    font-size: .75rem;
    font-weight: 600;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .slot-current-label {
    font-size: .75rem;
    color: #f47174;
    font-weight: 600;
  }

  .slot-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .slot-btn {
    background: rgba(255,255,255,.05);
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #8b949e;
    font-size: .68rem;
    padding: 6px 2px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
    line-height: 1.3;
  }
  .slot-btn:hover { background: rgba(231,76,60,.2); border-color: #e74c3c; color: #f47174; }
  .slot-btn.active {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    border-color: #e74c3c;
    color: #fff;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(231,76,60,.4);
  }
  .slot-btn.has-data { border-color: rgba(244,113,116,.4); }
  .slot-btn .slot-count {
    display: block;
    font-size: .6rem;
    opacity: .7;
    margin-top: 1px;
  }
  .slot-btn-all {
    grid-column: span 1;
    font-size: .72rem;
    font-weight: 600;
  }

  /* ── Popup ── */
  .maplibregl-popup-content {
    background: rgba(22,27,34,.95) !important;
    border: 1px solid #30363d !important;
    border-radius: 10px !important;
    color: #e6edf3 !important;
    padding: 12px 14px !important;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif !important;
    font-size: .82rem !important;
    min-width: 180px;
  }
  .maplibregl-popup-tip { border-top-color: rgba(22,27,34,.95) !important; }
  .popup-slot {
    background: rgba(231,76,60,.2);
    border: 1px solid #e74c3c;
    color: #f47174;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: .7rem;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 6px;
  }
  .popup-addr { color: #e6edf3; margin-bottom: 4px; font-weight: 500; }
  .popup-desc { color: #8b949e; font-size: .78rem; }
  .popup-time { color: #6e7681; font-size: .72rem; margin-top: 6px; }

  /* ── Loading ── */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(13,17,23,.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    backdrop-filter: blur(4px);
  }
  .loading-overlay.hidden { display: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #30363d;
    border-top-color: #e74c3c;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 脈衝動畫（CSS）── */
  @keyframes pulse-ring {
    0%   { transform: scale(.8); opacity: .8; }
    70%  { transform: scale(1.6); opacity: 0; }
    100% { transform: scale(1.6); opacity: 0; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-icon">🚭</div>
    <div>
      <h1>台北市吸菸熱點地圖</h1>
      <p>即時市民通報資料</p>
    </div>
  </div>
  <a class="report-btn" id="report-link" href="#" target="_blank">
    📍 我要通報
  </a>
</div>

<!-- 地圖 -->
<div id="map">
  <!-- 統計浮框 -->
  <div class="stats-overlay">
    <div class="stat-row">
      <span>顯示點位</span>
      <span class="stat-num" id="stat-visible">—</span>
    </div>
    <div class="stat-row">
      <span>總回報數</span>
      <span class="stat-num" id="stat-total">—</span>
    </div>
    <div class="stat-row">
      <span>最熱時段</span>
      <span class="stat-num" id="stat-peak">—</span>
    </div>
  </div>

  <!-- 定位按鈕 -->
  <button class="locate-btn" id="locate-btn" title="移至我的位置">📍</button>

  <!-- 時段選擇面板 -->
  <div class="slot-panel">
    <div class="slot-panel-inner">
      <div class="slot-header">
        <span class="slot-header-title">⏱ 時段篩選</span>
        <span class="slot-current-label" id="slot-current-label"></span>
      </div>
      <div class="slot-grid" id="slot-grid">
        <!-- 由 JS 動態產生 -->
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
<script>
// ── 設定 ─────────────────────────────────────────────────────
var API_URL = 'https://script.google.com/macros/s/AKfycbybrd7nwa_fNo4WWU9kE0t5Oiy5hmRfdfizWqa26InhZXeI0c_nXsvtewhmIufEzdwp/exec';  // ← 部署 Apps Script 後填入
var MOCK_URL = './api-mock.json';
var TAIPEI_CENTER = [121.5654, 25.0330];

var SLOT_LABELS = [
  '00–02','02–04','04–06','06–08',
  '08–10','10–12','12–14','14–16',
  '16–18','18–20','20–22','22–24'
];

// ── 狀態 ─────────────────────────────────────────────────────
var allFeatures = [];
var currentSlot = 'all';
var map;

// ── 地圖初始化 ────────────────────────────────────────────────
map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: TAIPEI_CENTER,
  zoom: 12,
  minZoom: 10,
  maxZoom: 18,
  attributionControl: false
});

map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.on('load', function() {
  initLayers();
  loadData();
  updateCurrentSlotLabel();
  setInterval(updateCurrentSlotLabel, 60000);
});

// ── 圖層初始化 ────────────────────────────────────────────────
function initLayers() {
  map.addSource('reports', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] },
    cluster: false
  });

  // 脈衝外圈
  map.addLayer({
    id: 'reports-pulse',
    type: 'circle',
    source: 'reports',
    paint: {
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        10, 12, 14, 22, 18, 30
      ],
      'circle-color': '#e74c3c',
      'circle-opacity': 0,
      'circle-stroke-width': 2,
      'circle-stroke-color': '#e74c3c',
      'circle-stroke-opacity': [
        'interpolate', ['linear'], ['zoom'],
        10, 0.3, 14, 0.15
      ]
    }
  });

  // 熱力漸變點位（主圖層）
  map.addLayer({
    id: 'reports-circle',
    type: 'circle',
    source: 'reports',
    paint: {
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        10, 7, 14, 14, 18, 22
      ],
      'circle-color': [
        'interpolate', ['linear'],
        ['get', 'time_slot'],
        0,  '#3498db',
        3,  '#2ecc71',
        6,  '#f1c40f',
        9,  '#e67e22',
        11, '#e74c3c'
      ],
      'circle-opacity': .85,
      'circle-stroke-width': 1.5,
      'circle-stroke-color': '#fff',
      'circle-stroke-opacity': .6,
      'circle-blur': .1
    }
  });

  // 滑鼠互動
  map.on('mouseenter', 'reports-circle', function() {
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('mouseleave', 'reports-circle', function() {
    map.getCanvas().style.cursor = '';
  });
  map.on('click', 'reports-circle', function(e) {
    var props = e.features[0].properties;
    var coords = e.features[0].geometry.coordinates.slice();
    var slot = parseInt(props.time_slot);
    var ts = props.timestamp ? new Date(props.timestamp).toLocaleString('zh-TW') : '';

    new maplibregl.Popup({ offset: 12, maxWidth: '240px' })
      .setLngLat(coords)
      .setHTML(
        '<div class="popup-slot">⏱ ' + SLOT_LABELS[slot] + '</div>' +
        (props.address_input ? '<div class="popup-addr">📍 ' + esc(props.address_input) + '</div>' : '') +
        (props.description ? '<div class="popup-desc">' + esc(props.description) + '</div>' : '') +
        (ts ? '<div class="popup-time">🕐 ' + ts + '</div>' : '')
      )
      .addTo(map);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 資料載入 ──────────────────────────────────────────────────
function loadData() {
  var url = (API_URL && API_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL')
    ? API_URL + '?action=getReports'
    : MOCK_URL;

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(geojson) {
      allFeatures = geojson.features || [];
      buildSlotButtons();
      filterAndRender(currentSlot);
      document.getElementById('loading').classList.add('hidden');
    })
    .catch(function() {
      // Fallback to mock
      fetch(MOCK_URL)
        .then(function(r) { return r.json(); })
        .then(function(geojson) {
          allFeatures = geojson.features || [];
          buildSlotButtons();
          filterAndRender(currentSlot);
          document.getElementById('loading').classList.add('hidden');
        });
    });
}

// ── 時段按鈕建立 ──────────────────────────────────────────────
function buildSlotButtons() {
  var slotCounts = new Array(12).fill(0);
  allFeatures.forEach(function(f) {
    var s = parseInt(f.properties.time_slot);
    if (s >= 0 && s < 12) slotCounts[s]++;
  });

  var grid = document.getElementById('slot-grid');
  grid.innerHTML = '';

  // 全部按鈕
  var allBtn = document.createElement('button');
  allBtn.className = 'slot-btn slot-btn-all' + (currentSlot === 'all' ? ' active' : '');
  allBtn.dataset.slot = 'all';
  allBtn.innerHTML = '全部<span class="slot-count">' + allFeatures.length + '</span>';
  allBtn.onclick = function() { selectSlot('all'); };
  grid.appendChild(allBtn);

  SLOT_LABELS.forEach(function(label, i) {
    var btn = document.createElement('button');
    var hasData = slotCounts[i] > 0;
    btn.className = 'slot-btn' +
      (currentSlot === String(i) ? ' active' : '') +
      (hasData ? ' has-data' : '');
    btn.dataset.slot = String(i);
    btn.innerHTML = label + '<span class="slot-count">' + (hasData ? slotCounts[i] : '–') + '</span>';
    btn.onclick = function() { selectSlot(String(i)); };
    grid.appendChild(btn);
  });
}

function selectSlot(slot) {
  currentSlot = slot;
  document.querySelectorAll('.slot-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.slot === slot);
  });
  filterAndRender(slot);
}

// ── 資料篩選與渲染 ────────────────────────────────────────────
function filterAndRender(slot) {
  var filtered = slot === 'all'
    ? allFeatures
    : allFeatures.filter(function(f) {
        return String(f.properties.time_slot) === slot;
      });

  if (map.getSource('reports')) {
    map.getSource('reports').setData({
      type: 'FeatureCollection',
      features: filtered
    });
  }

  // 統計更新
  document.getElementById('stat-visible').textContent = filtered.length;
  document.getElementById('stat-total').textContent = allFeatures.length;

  // 最熱時段
  if (allFeatures.length > 0) {
    var counts = new Array(12).fill(0);
    allFeatures.forEach(function(f) {
      var s = parseInt(f.properties.time_slot);
      if (s >= 0 && s < 12) counts[s]++;
    });
    var peak = counts.indexOf(Math.max.apply(null, counts));
    document.getElementById('stat-peak').textContent = SLOT_LABELS[peak];
  }
}

// ── 目前時段標記 ─────────────────────────────────────────────
function updateCurrentSlotLabel() {
  var slot = Math.floor(new Date().getHours() / 2);
  document.getElementById('slot-current-label').textContent =
    '目前時段：' + SLOT_LABELS[slot];
}

// ── 定位按鈕 ─────────────────────────────────────────────────
document.getElementById('locate-btn').addEventListener('click', function() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos) {
    map.flyTo({
      center: [pos.coords.longitude, pos.coords.latitude],
      zoom: 15,
      duration: 1000
    });
  });
});

// ── 通報連結（部署後自動填入）── ──────────────────────────────
(function setReportLink() {
  var link = document.getElementById('report-link');
  if (API_URL && API_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
    link.href = API_URL;
  } else {
    link.href = '#';
    link.title = '請先部署 Apps Script 並填入 API_URL';
  }
})();
</script>
</body>
</html>
