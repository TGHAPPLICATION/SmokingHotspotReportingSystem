<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台北市吸菸熱點地圖</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    background: #0d1117; color: #e6edf3;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ── Header ── */
  .header {
    background: rgba(13,17,23,.95);
    border-bottom: 1px solid #21262d;
    padding: 0 14px;
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 10; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .header-icon {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: .85rem; flex-shrink: 0;
  }
  .header h1 { font-size: .88rem; font-weight: 700; }
  .header-sub { font-size: .68rem; color: #6e7681; margin-left: 2px; }
  .report-btn {
    background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff;
    border: none; border-radius: 8px; padding: 6px 12px;
    font-size: .78rem; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
    transition: opacity .2s; white-space: nowrap; flex-shrink: 0;
  }
  .report-btn:hover { opacity: .85; }

  #map { flex: 1; position: relative; min-height: 0; }

  /* ── 左側控制面板 ── */
  .left-panel {
    position: absolute; top: 10px; left: 10px;
    background: rgba(13,17,23,.9);
    backdrop-filter: blur(12px);
    border: 1px solid #30363d;
    border-radius: 12px;
    z-index: 5;
    width: 160px;
    overflow: hidden;
  }

  /* 統計圓圈 */
  .stat-circles {
    padding: 12px 8px 10px;
    display: flex;
    gap: 4px;
  }
  .stat-circle {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .stat-ring {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; line-height: 1.1;
    position: relative;
  }
  .stat-ring-visible {
    border: 2.5px solid #60a5fa;
    background: rgba(96,165,250,.1);
    color: #93c5fd;
    font-size: 1.05rem;
  }
  .stat-ring-total {
    border: 2.5px solid #818cf8;
    background: rgba(129,140,248,.1);
    color: #a5b4fc;
    font-size: 1.05rem;
  }
  .stat-ring-peak {
    border: 2.5px solid #f47174;
    background: rgba(244,113,116,.1);
    color: #f47174;
    font-size: .62rem;
    text-align: center;
    padding: 0 3px;
    word-break: break-all;
  }
  .stat-label {
    font-size: .58rem; color: #6e7681; text-align: center; line-height: 1.2;
    white-space: nowrap;
  }

  /* 資料來源徽章 */
  .data-source-badge {
    padding: 5px 10px; border-top: 1px solid #21262d;
    font-size: .63rem; color: #8b949e; display: flex; align-items: center; gap: 4px;
  }
  .data-source-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: #8b949e; flex-shrink: 0; }
  .data-source-badge.live .dot { background: #2ecc71; }
  .data-source-badge.mock .dot { background: #f1c40f; }
  .data-source-badge.err  .dot { background: #e74c3c; }

  /* 視圖切換 */
  .panel-view { padding: 6px 8px; display: flex; gap: 4px; border-top: 1px solid #21262d; }
  .view-btn {
    flex: 1; background: rgba(255,255,255,.04); border: 1px solid #30363d;
    border-radius: 7px; color: #8b949e; font-size: .64rem; font-weight: 600;
    cursor: pointer; padding: 5px 2px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: all .15s; line-height: 1.2;
  }
  .view-btn .vicon { font-size: .88rem; }
  .view-btn:hover { color: #e6edf3; border-color: #484f58; background: rgba(255,255,255,.07); }
  .view-btn.active { color: #f47174; border-color: #e74c3c; background: rgba(231,76,60,.15); font-weight: 700; }

  /* 圖例 */
  .panel-legend { padding: 7px 10px 9px; border-top: 1px solid #21262d; }
  .legend-title { font-size: .62rem; font-weight: 700; color: #6e7681; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: .68rem; color: #8b949e; }
  .legend-row:last-child { margin-bottom: 0; }
  .legend-swatch {
    border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,.3);
    display: flex; align-items: center; justify-content: center;
    font-size: .5rem; font-weight: 700; color: #fff;
  }
  .panel-legend.hidden { display: none; }

  /* 時段篩選列 */
  .slot-filter { padding: 7px 10px 9px; border-top: 1px solid #21262d; }
  .slot-filter-title { font-size: .62rem; font-weight: 700; color: #6e7681; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
  .slot-filter-clear { font-size: .6rem; font-weight: 400; color: #484f58; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .slot-filter-clear:hover { color: #8b949e; }
  .slot-band {
    display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
    font-size: .68rem; color: #8b949e; cursor: pointer;
    padding: 2px 4px; border-radius: 4px; user-select: none;
    transition: background .15s;
  }
  .slot-band:last-child { margin-bottom: 0; }
  .slot-band:hover { background: rgba(255,255,255,.06); }
  .slot-band.active { color: #e6edf3; background: rgba(255,255,255,.1); }
  .slot-band.dimmed { opacity: .35; }
  .slot-band .band-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .slot-band .band-count { margin-left: auto; font-size: .6rem; color: #484f58; }

  /* ── 右側圖示按鈕 ── */
  .right-btns {
    position: absolute; top: 10px; right: 10px;
    display: flex; flex-direction: column; gap: 6px; z-index: 5;
  }
  .icon-btn {
    width: 36px; height: 36px;
    background: rgba(13,17,23,.9); backdrop-filter: blur(10px);
    border: 1px solid #30363d; border-radius: 9px;
    color: #e6edf3; font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .icon-btn:hover { background: rgba(231,76,60,.25); border-color: #484f58; }
  .icon-btn.refresh:hover { background: rgba(46,204,113,.18); }

  /* ── Popup ── */
  .maplibregl-popup-content {
    background: rgba(22,27,34,.96) !important; border: 1px solid #30363d !important;
    border-radius: 10px !important; color: #e6edf3 !important;
    padding: 11px 13px !important;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif !important;
    font-size: .8rem !important; min-width: 175px;
  }
  .maplibregl-popup-tip { border-top-color: rgba(22,27,34,.96) !important; }
  .popup-slot {
    background: rgba(231,76,60,.18); border: 1px solid #e74c3c; color: #f47174;
    border-radius: 5px; padding: 2px 7px; font-size: .67rem; font-weight: 600;
    display: inline-block; margin-bottom: 5px;
  }
  .popup-addr { color: #e6edf3; margin-bottom: 3px; font-weight: 500; }
  .popup-desc { color: #8b949e; font-size: .76rem; }
  .popup-time { color: #6e7681; font-size: .7rem; margin-top: 5px; }

  /* ── Loading ── */
  .loading-overlay {
    position: absolute; inset: 0; background: rgba(13,17,23,.65);
    display: flex; align-items: center; justify-content: center;
    z-index: 20; backdrop-filter: blur(4px);
  }
  .loading-overlay.hidden { display: none; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid #30363d;
    border-top-color: #e74c3c; border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">🚭</div>
    <h1>台北市吸菸熱點地圖</h1>
    <span class="header-sub">即時通報</span>
  </div>
  <a class="report-btn" id="report-link" href="#" target="_blank">📍 通報</a>
</div>

<div id="map">

  <!-- 左側控制面板 -->
  <div class="left-panel">

    <!-- 統計圓圈 -->
    <div class="stat-circles">
      <div class="stat-circle">
        <div class="stat-ring stat-ring-visible" id="stat-visible">—</div>
        <div class="stat-label">顯示<br>點位</div>
      </div>
      <div class="stat-circle">
        <div class="stat-ring stat-ring-total" id="stat-total">—</div>
        <div class="stat-label">總回<br>報數</div>
      </div>
      <div class="stat-circle">
        <div class="stat-ring stat-ring-peak" id="stat-peak">—</div>
        <div class="stat-label">最熱<br>時段</div>
      </div>
    </div>

    <!-- 資料來源 -->
    <div class="data-source-badge" id="data-source-badge">
      <div class="dot"></div><span id="data-source-text">載入中…</span>
    </div>

    <!-- 視圖切換 -->
    <div class="panel-view">
      <button class="view-btn active" id="btn-cluster"><span class="vicon">🔵</span>分群</button>
      <button class="view-btn" id="btn-heatmap"><span class="vicon">🔥</span>熱力</button>
      <button class="view-btn" id="btn-points"><span class="vicon">⚪</span>點位</button>
    </div>

    <!-- 圖例（分群模式）-->
    <div class="panel-legend" id="legend-cluster">
      <div class="legend-title">群組大小</div>
      <div class="legend-row">
        <div class="legend-swatch" style="background:#2ecc71; width:13px; height:13px;"></div><span>1–4 筆</span>
      </div>
      <div class="legend-row">
        <div class="legend-swatch" style="background:#f1c40f; width:17px; height:17px;">5</div><span>5–14 筆</span>
      </div>
      <div class="legend-row">
        <div class="legend-swatch" style="background:#e67e22; width:21px; height:21px;">15</div><span>15–29 筆</span>
      </div>
      <div class="legend-row">
        <div class="legend-swatch" style="background:#e74c3c; width:25px; height:25px;">30</div><span>30 筆以上</span>
      </div>
    </div>

    <!-- 圖例（點位模式）-->
    <div class="panel-legend hidden" id="legend-points">
      <div class="legend-title">點位色階</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#60a5fa; width:11px; height:11px;"></div><span>00–04 時</span></div>
      <div class="legend-row"><div class="legend-swatch" style="background:#34d399; width:11px; height:11px;"></div><span>04–10 時</span></div>
      <div class="legend-row"><div class="legend-swatch" style="background:#facc15; width:11px; height:11px;"></div><span>10–16 時</span></div>
      <div class="legend-row"><div class="legend-swatch" style="background:#f87171; width:11px; height:11px;"></div><span>16–24 時</span></div>
    </div>

    <!-- 時段篩選（所有模式共用）-->
    <div class="slot-filter" id="slot-filter">
      <div class="slot-filter-title">通報時段 <span class="slot-filter-clear" id="slot-clear">全選</span></div>
      <div class="slot-band active" data-band="0"><div class="band-dot" style="background:#60a5fa"></div><span>00–04 時</span><span class="band-count" id="bc-0"></span></div>
      <div class="slot-band active" data-band="1"><div class="band-dot" style="background:#34d399"></div><span>04–10 時</span><span class="band-count" id="bc-1"></span></div>
      <div class="slot-band active" data-band="2"><div class="band-dot" style="background:#facc15"></div><span>10–16 時</span><span class="band-count" id="bc-2"></span></div>
      <div class="slot-band active" data-band="3"><div class="band-dot" style="background:#f87171"></div><span>16–24 時</span><span class="band-count" id="bc-3"></span></div>
    </div>

  </div>

  <!-- 右側圖示按鈕 -->
  <div class="right-btns">
    <button class="icon-btn" id="locate-btn" title="移至我的位置">📍</button>
    <button class="icon-btn refresh" id="refresh-btn" title="重新載入">🔄</button>
  </div>

  <div class="loading-overlay" id="loading"><div class="spinner"></div></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbybrd7nwa_fNo4WWU9kE0t5Oiy5hmRfdfizWqa26InhZXeI0c_nXsvtewhmIufEzdwp/exec';
var MOCK_URL = './api-mock.json';
var TAIPEI_CENTER = [121.5654, 25.0330];
var SLOT_LABELS = ['00–02','02–04','04–06','06–08','08–10','10–12','12–14','14–16','16–18','18–20','20–22','22–24'];

var SLOT_COLORS = [
  '#60a5fa','#818cf8','#a78bfa','#34d399',
  '#4ade80','#facc15','#fb923c','#f87171',
  '#ef4444','#dc2626','#7c3aed','#2563eb'
];

var allFeatures = [];
var viewMode = 'cluster';
var map;

var sc = null; // supercluster 實例

function buildSupercluster(features) {
  try {
    sc = new Supercluster({ radius: 50, maxZoom: 15 });
    sc.load(features);
    console.log('[cluster] supercluster loaded', features.length, 'features');
  } catch(e) {
    console.error('[cluster] buildSupercluster failed', e);
    sc = null;
  }
}

function abbrev(n) {
  return n >= 1000 ? Math.floor(n / 1000) + 'k' : String(n);
}

function updateClusters() {
  if (!sc || !map || !map.getSource('reports')) return;
  if (viewMode !== 'cluster') return;
  try {
    var bounds = map.getBounds();
    var zoom = Math.floor(map.getZoom());
    var bbox = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];
    var clusters = sc.getClusters(bbox, zoom);
    // 預先寫入 label 字串，避免在 MapLibre expression 裡做複雜運算
    clusters.forEach(function(f) {
      if (f.properties.point_count) {
        f.properties.point_count_label = abbrev(f.properties.point_count);
      }
    });
    map.getSource('reports').setData({ type: 'FeatureCollection', features: clusters });
    console.log('[cluster] updateClusters zoom=' + zoom + ' clusters=' + clusters.length);
  } catch(e) {
    console.error('[cluster] updateClusters failed', e);
  }
}

// 時段 band 對應的 time_slot 範圍（0–11 共 12 個 2 小時時段）
var SLOT_BANDS = [
  { slots: [0, 1],        label: '00–04 時' },
  { slots: [2, 3, 4],     label: '04–10 時' },
  { slots: [5, 6, 7],     label: '10–16 時' },
  { slots: [8, 9, 10, 11], label: '16–24 時' }
];
// 目前選取的 band 集合（全選狀態）
var activeBands = new Set([0, 1, 2, 3]);

map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: TAIPEI_CENTER, zoom: 12, minZoom: 10, maxZoom: 18,
  attributionControl: false
});
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.on('load', function() {
  try { initLayers(); } catch(e) { console.error('[initLayers] FAILED:', e); }
  loadData();
});

function initLayers() {
  map.addSource('reports', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] }
  });

  map.addSource('reports-heat', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] }
  });

  map.addLayer({
    id: 'layer-heatmap', type: 'heatmap', source: 'reports-heat',
    layout: { visibility: 'none' },
    paint: {
      'heatmap-weight': 0.4,
      'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 10, 0.6, 13, 1.5, 15, 3],
      'heatmap-color': [
        'interpolate', ['linear'], ['heatmap-density'],
        0,    'rgba(0,0,0,0)',
        0.05, 'rgba(33,102,172,0.5)',
        0.2,  'rgb(103,169,207)',
        0.4,  'rgb(253,219,199)',
        0.6,  'rgb(239,138,98)',
        0.8,  'rgb(217,72,1)',
        1,    'rgb(178,24,43)'
      ],
      // 半徑壓小，拉近才放大，讓熱點保持空間獨立
      'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 10, 4, 13, 12, 15, 22],
      'heatmap-opacity': 0.85
    }
  });

  // ── 分群模式圖層（source: reports，有 cluster） ──

  // 分群外暈光環
  map.addLayer({
    id: 'layer-cluster-glow', type: 'circle', source: 'reports',
    filter: ['has', 'point_count'],
    layout: { visibility: 'visible' },
    paint: {
      'circle-color': ['step', ['coalesce', ['get', 'point_count'], 0], '#2ecc71', 5, '#f1c40f', 15, '#e67e22', 30, '#e74c3c'],
      'circle-radius': ['step', ['coalesce', ['get', 'point_count'], 0], 22, 5, 34, 15, 48, 30, 62],
      'circle-opacity': ['step', ['coalesce', ['get', 'point_count'], 0], 0.12, 5, 0.15, 15, 0.18, 30, 0.22],
      'circle-blur': 0.65, 'circle-stroke-width': 0
    }
  });

  // 分群主圓
  map.addLayer({
    id: 'layer-clusters', type: 'circle', source: 'reports',
    filter: ['has', 'point_count'],
    layout: { visibility: 'visible' },
    paint: {
      'circle-color': ['step', ['coalesce', ['get', 'point_count'], 0], '#2ecc71', 5, '#f1c40f', 15, '#e67e22', 30, '#e74c3c'],
      'circle-radius': ['step', ['coalesce', ['get', 'point_count'], 0], 14, 5, 22, 15, 32, 30, 42],
      'circle-opacity': 0.92,
      'circle-stroke-width': 2, 'circle-stroke-color': 'rgba(255,255,255,.65)'
    }
  });

  // 分群數字（使用 OpenFreeMap 支援的字體）
  map.addLayer({
    id: 'layer-cluster-count', type: 'symbol', source: 'reports',
    filter: ['has', 'point_count'],
    layout: {
      visibility: 'visible',
      'text-field': ['coalesce', ['get', 'point_count_label'], ''],
      'text-font': ['Noto Sans Bold', 'Noto Sans Regular'],
      'text-size': ['step', ['coalesce', ['get', 'point_count'], 0], 12, 15, 13, 30, 15],
      'text-allow-overlap': true
    },
    paint: { 'text-color': '#fff', 'text-halo-color': 'rgba(0,0,0,.3)', 'text-halo-width': 1 }
  });

  // 分群模式：展開後個別點（reports source，filter: !has point_count）
  map.addLayer({
    id: 'layer-halo', type: 'circle', source: 'reports',
    filter: ['!', ['has', 'point_count']],
    layout: { visibility: 'visible' },
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 14, 8, 18, 16],
      'circle-color': '#ffffff', 'circle-opacity': 0.18, 'circle-stroke-width': 0
    }
  });

  map.addLayer({
    id: 'layer-points', type: 'circle', source: 'reports',
    filter: ['!', ['has', 'point_count']],
    layout: { visibility: 'visible' },
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 14, 5, 18, 12],
      'circle-color': [
        'step', ['coalesce', ['to-number', ['get', 'time_slot']], 0],
        '#60a5fa', 2, '#34d399', 5, '#facc15', 8, '#f87171'
      ],
      'circle-opacity': 0.9, 'circle-stroke-width': 1.5,
      'circle-stroke-color': '#fff', 'circle-stroke-opacity': 0.8
    }
  });

  // ── 點位模式圖層（source: reports-heat，無分群，顯示全部原始點）──
  map.addLayer({
    id: 'layer-halo-raw', type: 'circle', source: 'reports-heat',
    layout: { visibility: 'none' },
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 4, 14, 9, 18, 16],
      'circle-color': '#ffffff', 'circle-opacity': 0.15, 'circle-stroke-width': 0
    }
  });

  map.addLayer({
    id: 'layer-points-raw', type: 'circle', source: 'reports-heat',
    layout: { visibility: 'none' },
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 3, 14, 6, 18, 11],
      'circle-color': [
        'step', ['coalesce', ['to-number', ['get', 'time_slot']], 0],
        '#60a5fa',  // slot 0–1  (00–04 時)
        2,  '#34d399',  // slot 2–4  (04–10 時)
        5,  '#facc15',  // slot 5–7  (10–16 時)
        8,  '#f87171'   // slot 8–11 (16–24 時)
      ],
      'circle-opacity': 0.85, 'circle-stroke-width': 0
    }
  });

  // ── 互動事件 ──
  map.on('click', 'layer-clusters', function(e) {
    var feature = map.queryRenderedFeatures(e.point, { layers: ['layer-clusters'] })[0];
    if (!feature || !sc) return;
    var clusterId = feature.properties.cluster_id;
    var zoom = sc.getClusterExpansionZoom(clusterId);
    map.easeTo({ center: feature.geometry.coordinates, zoom: Math.min(zoom, 18), duration: 400 });
  });

  function showPointPopup(e) {
    var props = e.features[0].properties;
    var coords = e.features[0].geometry.coordinates.slice();
    var slot = parseInt(props.time_slot) || 0;
    var ts = props.timestamp ? new Date(props.timestamp).toLocaleString('zh-TW') : '';
    new maplibregl.Popup({ offset: 12, maxWidth: '240px' })
      .setLngLat(coords)
      .setHTML(
        '<div class="popup-slot">⏱ ' + SLOT_LABELS[slot] + '</div>' +
        (props.address_input ? '<div class="popup-addr">📍 ' + esc(props.address_input) + '</div>' : '') +
        (props.description   ? '<div class="popup-desc">' + esc(props.description) + '</div>' : '') +
        (ts ? '<div class="popup-time">🕐 ' + ts + '</div>' : '')
      ).addTo(map);
  }

  map.on('click', 'layer-points', showPointPopup);
  map.on('click', 'layer-points-raw', showPointPopup);

  ['layer-clusters','layer-points','layer-points-raw'].forEach(function(id) {
    map.on('mouseenter', id, function() { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', id, function() { map.getCanvas().style.cursor = ''; });
  });

  // 地圖移動/縮放時重算群組
  map.on('moveend', updateClusters);
  map.on('zoomend', updateClusters);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

var LAYER_VIS = {
  cluster: { 'layer-heatmap': 'none',    'layer-cluster-glow': 'visible', 'layer-clusters': 'visible', 'layer-cluster-count': 'visible', 'layer-halo': 'visible', 'layer-points': 'visible', 'layer-halo-raw': 'none',    'layer-points-raw': 'none'    },
  heatmap: { 'layer-heatmap': 'visible', 'layer-cluster-glow': 'none',    'layer-clusters': 'none',    'layer-cluster-count': 'none',    'layer-halo': 'none',    'layer-points': 'none',    'layer-halo-raw': 'none',    'layer-points-raw': 'none'    },
  points:  { 'layer-heatmap': 'none',    'layer-cluster-glow': 'none',    'layer-clusters': 'none',    'layer-cluster-count': 'none',    'layer-halo': 'none',    'layer-points': 'none',    'layer-halo-raw': 'visible', 'layer-points-raw': 'visible' }
};

function setViewMode(mode) {
  viewMode = mode;
  var vis = LAYER_VIS[mode];
  Object.keys(vis).forEach(function(id) {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', vis[id]);
  });
  document.querySelectorAll('.view-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.id === 'btn-' + mode);
  });
  document.getElementById('legend-cluster').classList.toggle('hidden', mode !== 'cluster');
  document.getElementById('legend-points').classList.toggle('hidden', mode !== 'points');
  if (mode === 'cluster') updateClusters();
}

document.getElementById('btn-cluster').addEventListener('click', function() { setViewMode('cluster'); });
document.getElementById('btn-heatmap').addEventListener('click', function() { setViewMode('heatmap'); });
document.getElementById('btn-points').addEventListener('click',  function() { setViewMode('points'); });

// 時段 band 篩選
document.querySelectorAll('.slot-band').forEach(function(el) {
  el.addEventListener('click', function() {
    var b = parseInt(el.dataset.band);
    if (activeBands.has(b)) {
      // 至少保留一個選取
      if (activeBands.size > 1) activeBands.delete(b);
    } else {
      activeBands.add(b);
    }
    updateSlotBandUI();
    applyFilter();
  });
});
document.getElementById('slot-clear').addEventListener('click', function() {
  if (activeBands.size === 4) return; // 已全選
  activeBands = new Set([0, 1, 2, 3]);
  updateSlotBandUI();
  applyFilter();
});

function setDataSource(type, text) {
  var badge = document.getElementById('data-source-badge');
  badge.className = 'data-source-badge ' + type;
  document.getElementById('data-source-text').textContent = text;
}

function fitToFeatures(features) {
  if (!features || features.length === 0) return;
  if (features.length === 1) { map.flyTo({ center: features[0].geometry.coordinates, zoom: 15, duration: 1200 }); return; }
  var bounds = new maplibregl.LngLatBounds();
  features.forEach(function(f) { bounds.extend(f.geometry.coordinates); });
  map.fitBounds(bounds, { padding: 80, maxZoom: 15, duration: 1200 });
}

function normalizeFeatures(features) {
  return features.filter(function(f) {
    var c = f.geometry && f.geometry.coordinates;
    return c && !isNaN(parseFloat(c[0])) && !isNaN(parseFloat(c[1]));
  }).map(function(f) {
    f.properties.time_slot = parseInt(f.properties.time_slot) || 0;
    return f;
  });
}

function updateStats(filtered) {
  document.getElementById('stat-visible').textContent = filtered.length;
  document.getElementById('stat-total').textContent   = allFeatures.length;
  var src = filtered.length > 0 ? filtered : allFeatures;
  if (src.length > 0) {
    var counts = new Array(12).fill(0);
    src.forEach(function(f) {
      var s = parseInt(f.properties.time_slot);
      if (s >= 0 && s < 12) counts[s]++;
    });
    var peak = counts.indexOf(Math.max.apply(null, counts));
    document.getElementById('stat-peak').textContent = SLOT_LABELS[peak];
  }
}

function getFilteredFeatures() {
  // 計算所有選取 band 對應的 time_slot 集合
  var allowedSlots = new Set();
  activeBands.forEach(function(b) {
    SLOT_BANDS[b].slots.forEach(function(s) { allowedSlots.add(s); });
  });
  if (allowedSlots.size === 12) return allFeatures; // 全選，直接回傳
  return allFeatures.filter(function(f) {
    return allowedSlots.has(parseInt(f.properties.time_slot));
  });
}

function applyFilter() {
  var filtered = getFilteredFeatures();
  var fc = { type: 'FeatureCollection', features: filtered };
  // 重建 supercluster（cluster 模式用）
  buildSupercluster(filtered);
  updateClusters();
  // reports-heat 直接放全部原始點（heatmap / points 模式用）
  if (map.getSource('reports-heat')) map.getSource('reports-heat').setData(fc);
  updateStats(filtered);
}

function updateSlotBandUI() {
  var allActive = activeBands.size === 4;
  document.getElementById('slot-clear').textContent = allActive ? '全選' : '清除篩選';
  // 計算每個 band 的資料筆數
  var counts = [0, 0, 0, 0];
  allFeatures.forEach(function(f) {
    var s = parseInt(f.properties.time_slot);
    for (var b = 0; b < SLOT_BANDS.length; b++) {
      if (SLOT_BANDS[b].slots.indexOf(s) !== -1) { counts[b]++; break; }
    }
  });
  document.querySelectorAll('.slot-band').forEach(function(el) {
    var b = parseInt(el.dataset.band);
    var isActive = activeBands.has(b);
    el.classList.toggle('active', isActive);
    el.classList.toggle('dimmed', !isActive);
    document.getElementById('bc-' + b).textContent = counts[b] > 0 ? counts[b].toLocaleString() : '';
  });
}

function applyData(features) {
  allFeatures = features;
  updateSlotBandUI();
  applyFilter();
  document.getElementById('loading').classList.add('hidden');
}

function loadData() {
  document.getElementById('loading').classList.remove('hidden');
  setDataSource('', '載入中…');
  fetch(API_URL + '?action=getReports', { redirect: 'follow' })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(text) {
      var geojson = JSON.parse(text);
      if (!geojson.features) throw new Error('缺少 features');
      var features = normalizeFeatures(geojson.features);
      setDataSource('live', '即時資料 • ' + features.length + ' 筆');
      applyData(features);
      fitToFeatures(features);
    })
    .catch(function(err) {
      console.warn('API 載入失敗，改用 mock：', err);
      setDataSource('mock', '示範資料');
      fetch(MOCK_URL)
        .then(function(r) { return r.json(); })
        .then(function(geojson) { applyData(normalizeFeatures(geojson.features || [])); })
        .catch(function(e) {
          setDataSource('err', '載入失敗');
          document.getElementById('loading').classList.add('hidden');
          console.error(e);
        });
    });
}

document.getElementById('locate-btn').addEventListener('click', function() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos) {
    map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 15, duration: 1000 });
  });
});

document.getElementById('refresh-btn').addEventListener('click', loadData);

(function() {
  var link = document.getElementById('report-link');
  link.href = (API_URL && API_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL') ? API_URL : '#';
})();
</script>
</body>
</html>
